# Builds and deploys the three public sites (learn, blog, home) to Cloudflare.
# Uses the CLOUDFLARE_API_TOKEN repo secret. Each site posts a commit status
# ("<site>-deploy") with its URL, so the result is visible without the logs.
name: Deploy sites

on:
  push:
    branches: [main]
    paths: ['learn/**', 'blog/**', 'home/**', 'shared/**', 'package.json', 'package-lock.json', '.github/workflows/deploy-sites.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [learn, blog, home]
    concurrency:
      group: deploy-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:${{ matrix.site }}

      - name: Deploy
        id: deploy
        working-directory: ${{ matrix.site }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee ../deploy-${{ matrix.site }}.log

      - name: Check the site answers
        id: smoke
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy-${{ matrix.site }}.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/" || true)
          echo "HTTP $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: ${{ steps.deploy.outcome }}
          URL: ${{ steps.smoke.outputs.url }}
          CODE: ${{ steps.smoke.outputs.code }}
        run: |
          if [ "$DEPLOY" = success ] && [ "$CODE" = 200 ]; then state=success; desc="$URL | live"
          elif [ "$DEPLOY" = success ]; then state=failure; desc="$URL | deployed, but returned HTTP $CODE"
          else state=failure
            desc=$(grep -E 'ERROR|✘' deploy-${{ matrix.site }}.log 2>/dev/null | head -2 | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' ' ')
            desc=${desc:-build or deploy failed}
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context="${{ matrix.site }}-deploy" -f description="${desc:0:138}" >/dev/null
