# Deploys the admin Worker (admin/) to Cloudflare whenever it changes.
# Uses the CLOUDFLARE_API_TOKEN repo secret. Posts a short commit status
# ("admin-deploy") so the result is visible without opening the logs.
name: Deploy admin

on:
  push:
    branches: [main, admin-hello, admin-diagnose]
    paths: ['admin/**', '.github/workflows/deploy-admin.yml']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log

      - name: Check the site answers
        id: smoke
        run: |
          # A brand-new custom domain can take a minute or two to start answering.
          code=000
          for i in $(seq 1 18); do
            code=$(curl -s -o page.html -w '%{http_code}' https://admin.withchris.uk/ || true)
            [ "$code" != 000 ] && break
            sleep 10
          done
          echo "HTTP $code"; touch page.html
          if grep -q 'Hi Chris' page.html; then echo "result=live, public (no Access yet)" >> "$GITHUB_OUTPUT"
          elif grep -qi 'cloudflareaccess' page.html || [ "$code" = 302 ]; then echo "result=live, behind Access" >> "$GITHUB_OUTPUT"
          else echo "result=deployed, but site returned HTTP $code" >> "$GITHUB_OUTPUT"; fi

      # Posts what happened as a commit comment, so it can be read without the
      # Actions logs (which aren't reachable from Claude's sandbox). No secrets in it.
      - name: Post diagnostics
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cf() { curl -s "https://api.cloudflare.com/client/v4/$1" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"; }
          acct=$(cf accounts | jq -r '.result[0].id // empty')
          {
            echo '### admin deploy diagnostics'
            echo '**wrangler deploy (tail)**'; echo '```'; tail -15 deploy.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g'; echo '```'
            echo '**DNS**'; echo '```'; dig +short admin.withchris.uk A; dig +short admin.withchris.uk AAAA; echo '```'
            echo '**curl**'; echo '```'; curl -sS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 20 https://admin.withchris.uk/ 2>&1; echo '```'
            echo '**Workers custom domains**'; echo '```'
            cf "accounts/$acct/workers/domains" | jq -c '.errors, [.result[]? | {hostname, service, zone_name}]'
            echo '```'
            echo '**Zones the token sees**'; echo '```'; cf zones | jq -c '.errors, [.result[]? | {name, status}]'; echo '```'
          } > diag.md
          jq -n --rawfile body diag.md '{body: $body}' | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - >/dev/null

      - name: Report status
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.smoke.outputs.result }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY" = success ]; then state=success; desc="$RESULT"
          else state=failure
            desc=$(grep -E 'ERROR|✘|error' deploy.log 2>/dev/null | head -3 | tr -d '\033' | sed 's/\[[0-9;]*m//g' | tr '\n' ' ')
            desc=${desc:-deploy failed}
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=admin-deploy -f description="${desc:0:138}" >/dev/null
