# Deploys the admin Worker (admin/) to Cloudflare whenever it changes.
# Uses the CLOUDFLARE_API_TOKEN repo secret. Posts a short commit status
# ("admin-deploy") so the result is visible without opening the logs.
name: Deploy admin

on:
  push:
    branches: [main, cathy-chat]
    paths: ['admin/**', '.github/workflows/deploy-admin.yml']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee ../deploy.log

      # Copies the Worker's secrets from GitHub repo secrets. Skips any that aren't set.
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          jq -n 'env | {ANTHROPIC_API_KEY, ADMIN_PASSWORD} | with_entries(select(.value != null and .value != ""))' > secrets.json
          if [ "$(jq length secrets.json)" -gt 0 ]; then npx --yes wrangler@4 secret bulk secrets.json 2>&1 | tail -3; fi
          rm -f secrets.json

      - name: Check the site answers
        id: smoke
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://withchris-admin.withchris.workers.dev/ || true)
          echo "HTTP $code"
          case "$code" in
            401) echo "result=live, password protected" >> "$GITHUB_OUTPUT" ;;
            200) echo "result=live but NOT password protected" >> "$GITHUB_OUTPUT" ;;
            *)   echo "result=site returned HTTP $code" >> "$GITHUB_OUTPUT" ;;
          esac

      # Posts what happened as a commit comment, so it can be read without the
      # Actions logs (which aren't reachable from Claude's sandbox). No secrets in it.
      - name: Post diagnostics
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          cf() { curl -s "https://api.cloudflare.com/client/v4/$1" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"; }
          acct=$(cf accounts | jq -r '.result[0].id // empty')
          {
            echo '### admin deploy diagnostics'
            echo '**wrangler deploy (tail)**'; echo '```'; tail -15 deploy.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g'; echo '```'
            echo '**curl**'; echo '```'; curl -sS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 20 https://withchris-admin.withchris.workers.dev/ 2>&1; echo '```'
            echo '**Workers custom domains**'; echo '```'
            cf "accounts/$acct/workers/domains" | jq -c '.errors, [.result[]? | {hostname, service, zone_name}]'
            echo '```'
            echo '**Zones the token sees**'; echo '```'; cf zones | jq -c '.errors, [.result[]? | {name, status}]'; echo '```'
          } > diag.md
          jq -n --rawfile body diag.md '{body: $body}' | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - >/dev/null

      - name: Report status
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.smoke.outputs.result }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log 2>/dev/null | head -1)
          if [ "$DEPLOY" = success ]; then state=success; desc="${url:-no workers.dev url} | $RESULT"
          else state=failure
            desc=$(grep -E 'ERROR|✘|error' deploy.log 2>/dev/null | head -3 | tr -d '\033' | sed 's/\[[0-9;]*m//g' | tr '\n' ' ')
            desc=${desc:-deploy failed}
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=admin-deploy -f description="${desc:0:138}" >/dev/null
